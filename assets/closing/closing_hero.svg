<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .animated { animation: none !important; }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.92); }
      }
      .card-hover {
        transition: stroke 0.25s ease, filter 0.25s ease;
      }
      .card-hover:hover {
        stroke: #E2232F !important;
        stroke-width: 1.5px !important;
        filter: drop-shadow(0 0 10px rgba(226, 35, 47, 0.5));
      }
      .grid-block {
        transition: fill 0.2s ease, stroke 0.2s ease;
      }
      .grid-block:hover {
        fill: #2A0407 !important;
        stroke: #E2232F !important;
      }
    </style>
    
  </defs>
